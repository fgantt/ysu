<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/components/UsiMonitor.css"><link rel="stylesheet" href="/src/components/SecondaryPanelFrame.css"><style>
:root { --color-bg-panel:#10141b; --color-bg-card:#1a202a; --color-text-primary:#ddd; --color-heading:#eee; --color-border-medium:#39404b; --color-border-light:#303742; --color-accent:#4bd580; } body{margin:0;background:#242a35;color:#eee;font:14px sans-serif} #controls{padding:10px} #output{padding:10px} .usi-monitor-window{width:900px;max-width:100%;height:1000px;} button{margin:3px}
</style></head><body><div id="controls"><button onclick="change(1000,2,'native')">Tall two engines</button><button onclick="change(450,2,'native')">Short two engines</button><button onclick="change(800,3,'native')">Three engines</button><button onclick="change(700,1,'native')">One engine</button><button onclick="change(600,2,'floating')">Floating two engines</button><button onclick="change(1000,2,'native',true)">Engine output tab</button></div><div id="output" role="status"></div><div id="host"></div><script>
function change(height,count,mode,commands=false){const host=document.getElementById('host'); host.className=mode==='native'?'usi-monitor-window':'secondary-panel-frame secondary-panel-frame-floating';host.style.cssText=`position:relative;left:0;top:0;width:900px;height:${height}px;max-height:none;`;
const rows=Array.from({length:100},(_,i)=>`<tr><td>${i}s</td><td>1</td><td>20</td><td>100000</td><td>+100</td><td>7g7f 3c3d</td></tr>`).join('');
host.innerHTML=`<div class="usi-monitor usi-communication-monitor"><div class="usi-monitor-header"><h3>USI Communication Monitor</h3></div><div class="usi-monitor-tabs"><button class="tab-button">Engine Monitor</button><button class="tab-button active">Search</button></div><div class="usi-monitor-content"><div class="${commands?'engine-monitor-tab':'search-tab'}">${Array.from({length:count},(_,i)=>`<div class="engine-section">${i?'<div class="engine-divider"></div>':''}<div class="engine-header">Engine ${i+1}<span class="engine-nps">NPS: 300,000</span></div>${commands?'<div class="last-command-item"><label>Last Sent</label><div class="command-text sent-command">go infinite</div></div><div class="last-command-item engine-received-output"><label>Last Received</label><div class="command-text received-command">info depth 20 nodes 100000 pv 7g7f</div></div><div class="manual-command"><input placeholder="Enter USI command"><button>SEND</button></div>':`<div class="search-table-container"><table class="search-table"><thead><tr><th>Elapsed</th><th>Rank</th><th>Depth</th><th>Nodes</th><th>Score</th><th>PV</th></tr></thead><tbody>${rows}</tbody></table></div>`}</div>`).join('')}</div></div></div>`;
requestAnimationFrame(()=>{const body=host.querySelector('.usi-monitor-content').getBoundingClientRect(), sections=[...host.querySelectorAll('.engine-section')].map(e=>e.getBoundingClientRect()); const fills=Math.abs(sections.at(-1).bottom-body.bottom)<2; const tables=[...host.querySelectorAll('.search-table-container')]; const outputsFill=tables.every((table,i)=>Math.abs(table.getBoundingClientRect().bottom-(sections[i].bottom-parseFloat(getComputedStyle(table.parentElement).paddingBottom)))<2); const scrollContained=tables.every(table=>table.clientHeight>0 && table.scrollHeight>table.clientHeight); const equal=Math.max(...sections.map(r=>r.height))-Math.min(...sections.map(r=>r.height))<2;document.getElementById('output').textContent=`${fills&&equal&&outputsFill&&scrollContained?'PASS':'FAIL'} ${mode}, ${height}px, ${count} engines: body ${body.height.toFixed(1)}px; sections ${sections.map(r=>r.height.toFixed(1)).join(', ')}px; fills bottom=${fills}; equal shares=${equal}; outputs fill=${outputsFill}; scroll contained=${scrollContained}`;});}
change(1000,2,'native');
</script></body></html>
